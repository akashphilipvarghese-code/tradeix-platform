name: Dependency security remediation

on:
  push:
    paths:
      - '.github/workflows/dependency-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/security/require-production-session-secret'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply compatible npm security fixes
        run: npm audit fix --no-fund
      - name: Verify lockfile and application
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit verified dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No compatible dependency updates available.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(deps): apply verified compatible security updates'
          git push origin HEAD:security/require-production-session-secret
